[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-subtitle-translator"
version = "0.1.0"
description = "Translate English Jellyfin subtitles to Brazilian Portuguese"
requires-python = ">=3.11"
dependencies = [
  "pgsrip>=0.1.12,<0.2",
  "pysrt>=1.1.2,<2",
]

[project.scripts]
subtitle-translate = "subtitle_translator:main"

[tool.setuptools]
py-modules = ["subtitle_translator"]
