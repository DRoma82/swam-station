---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Apps:
    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.dannyroma.ca
        description: Media Server
        ping: jellyfin
        server: swam-station-docker
        container: jellyfin
        siteMonitor: http://jellyfin:8096
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
          fields: ["movies", "series", "episodes"]
          enableBlocks: true # optional, defaults to false
          enableNowPlaying: true # optional, defaults to true
          enableUser: true # optional, defaults to false
          showEpisodeNumber: true # optional, defaults to false
          expandOneStreamToTwoRows: false # optional, defaults to true
    - Jellyseerr:
        icon: jellyseerr
        href: https://jellyseerr.dannyroma.ca
        description: Media Request Manager
        ping: jellyseerr
        server: swam-station-docker
        container: jellyseerr
        siteMonitor: http://jellyseerr:5055
    - Radarr:
        icon: radarr
        href: https://radarr.dannyroma.ca
        description: Automated Movie Downloader
        ping: radarr
        server: swam-station-docker
        container: radarr
        siteMonitor: http://radarr:7878
        widget:
          type: radarr
          url: http://radarr:7878
          key: {{HOMEPAGE_VAR_RADARR_KEY}}
          fields: ["wanted", "missing", "queued"]
          enableQueue: true
    - Sonarr:
        icon: sonarr
        href: https://sonarr.dannyroma.ca
        description: Automated TV Show Downloader
        ping: sonarr
        server: swam-station-docker
        container: sonarr
        siteMonitor: http://sonarr:8989
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: {{HOMEPAGE_VAR_SONARR_KEY}}
          fields: ["wanted", "missing", "queued"]
          enableQueue: true
    - Tinfoil:
        icon: si-nintendoswitch
        href: https://tf.dannyroma.ca
        description: Switch Game Installer
        ping: tinfoil
        server: swam-station-docker
        container: tinfoil
        siteMonitor: http://tinfoil:9000

- Tools:
    - Tdarr:
        icon: tdarr
        href: https://tdarr.dannyroma.ca
        description: Library Automation / Subtitle Extract
        ping: tdarr
        server: swam-station-docker
        container: tdarr
        siteMonitor: http://tdarr:8265
        widget:
          type: tdarr
          url: http://tdarr:8265
    - qBitTorrent:
        icon: qbittorrent
        href: http://qbit.dannyroma.ca
        description: Torrent Download Manager
        ping: qbittorrent
        server: swam-station-docker
        container: qbittorrent
        siteMonitor: http://qbittorrent:9090
        widget:
          type: qbittorrent
          url: http://qbittorrent:9090
          username: dani
          password: {{HOMEPAGE_VAR_QBIT_PWD}}
    - prowlarr:
        icon: prowlarr
        href: http://prowlarr.dannyroma.ca
        description: Torrent Indexer Aggregator
        ping: prowlarr
        server: swam-station-docker
        container: prowlarr
        siteMonitor: http://prowlarr:9696
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
    - Home Assistant:
        icon: home-assistant
        href: http://ha.dannyroma.ca
        description: Home Automation
        ping: host.docker.internal
        server: swam-station-docker
        container: homeassistant
        siteMonitor: http://host.docker.internal:8123
        widget:
          type: homeassistant
          url: http://host.docker.internal:8123
          key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
    - Homepage:
        icon: homepage
        description: This Dashboard
        ping: homepage
        server: swam-station-docker
        container: homepage
        siteMonitor: http://homepage:3000

- System:
  - Nginx Proxy Manager:
      icon: nginx
      href: http://nginx.dannyroma.ca
      description: Reverse Proxy
      ping: npm
      server: swam-station-docker
      container: npm
      siteMonitor: http://npm:81
      widget:
        type: npm
        url: http://npm:81
        username: {{HOMEPAGE_VAR_NPM_USER}}
        password: {{HOMEPAGE_VAR_NPM_PWD}}
  - DDClient:
      icon: cloudflare
      description: Dynamic DNS update
      ping: ddclient
      server: swam-station-docker
      container: ddclient
  - Watchtower:
      icon: watchtower
      description: Automated Docker Container Updater
      ping: watchtower
      server: swam-station-docker
      container: watchtower
      widget:
        type: watchtower
        url: http://watchtower:8080
        key: {{HOMEPAGE_VAR_WATCHTOWER_KEY}}
