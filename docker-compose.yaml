services:

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    env_file:
      - .shared.env
    volumes:
      - ./apps/nginx-proxy-manager:/data
      - ./letsencrypt:/etc/letsencrypt

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .secrets.env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${SECRET_DOMAIN?error}
    ports:
      - 3000:3000
    volumes:
      - ./apps/homepage/logs:/app/config/logs
      - ./homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./homepage/docker.yaml:/app/config/docker.yaml:ro
      - ./homepage/services.yaml:/app/config/services.yaml:ro
      - ./homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/images:/app/public/images:ro
      - /mnt/seagate:/mnt/seagate:ro
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      - CONTAINERS=1
      - INFO=1
      - VERSION=1
      - PING=1
      - SERVICES=1
      - TASKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  ddclient:
    image: lscr.io/linuxserver/ddclient:latest
    container_name: ddclient
    env_file:
      - .shared.env
      - .secrets.env
    volumes:
      - ./apps/ddclient:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - WEBUI_PORT=9090
    env_file:
      - .shared.env
    volumes:
      - ./apps/qbittorrent:/config
      - /mnt/seagate:/seagate
    ports:
      - 9090:9090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    env_file:
      - .shared.env
    volumes:
      - ./apps/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - .shared.env
    volumes:
      - ./apps/sonarr:/config
      - /mnt/seagate:/seagate
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - .shared.env
    volumes:
      - ./apps/radarr:/config
      - /mnt/seagate:/seagate
    ports:
      - 7878:7878
    restart: unless-stopped

  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    volumes:
      - /mnt/seagate:/seagate
      - ./unpackerr:/config
    environment:
      - UN_LOG_FILE=/seagate/downloads/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_WEBSERVER_METRICS=true
    env_file:
      - .shared.env
      - .secrets.env
    ports:
      - 5656:5656
    restart: unless-stopped
      

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    env_file:
      - .shared.env
    volumes:
      - ./apps/bazarr:/config
      - /mnt/seagate:/seagate
    ports:
      - 6767:6767
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    env_file:
      - .shared.env
    ports:
      - 5055:5055
    volumes:
      - ./apps/jellyseerr:/app/config
    restart: unless-stopped
    
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    env_file:
      - .shared.env
    volumes:
      - ./apps/jellyfin:/config
      - /mnt/seagate/media/sonarr:/data/tvshows
      - /mnt/seagate/media/radarr:/data/movies
      - /mnt/seagate/media/Bellesa:/data/bellesa
      - /mnt/seagate/media/Masterclass:/data/masterclass
      - /usr/bin/whisper-cli:/usr/bin/whisper-cli:ro
      - /mnt/seagate/WhisperModels:/WhisperModels:ro
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp # discovery
    restart: unless-stopped

  reclaimerr:
    image: ghcr.io/jessielw/reclaimerr:latest
    container_name: reclaimerr
    restart: unless-stopped
    env_file:
      - .shared.env
    volumes:
      - ./apps/reclaimerr:/app/data
    ports:
      - "8000:8000"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    env_file:
      - .shared.env
    volumes:
      - ./apps/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .shared.env
      - .secrets.env
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - FIRECRAWL_API_URL=http://firecrawl:3002
    ports:
      - "8642:8642" # OpenAI-compatible API / health, protected by API_SERVER_KEY
      - "9119:9119" # Hermes dashboard, protected by basic auth
    volumes:
      - ./apps/hermes:/opt/data
    shm_size: "1gb"

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    env_file:
      - .secrets.env
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - ENV=local
      - USE_DB_AUTHENTICATION=false
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - POSTGRES_USER=firecrawl
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=firecrawl-postgres
      - POSTGRES_PORT=5432
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - NUM_WORKERS_PER_QUEUE=4
      - CRAWL_CONCURRENT_REQUESTS=5
      - MAX_CONCURRENT_JOBS=3
      - BROWSER_POOL_SIZE=3
      - LOGGING_LEVEL=INFO
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
    ports:
      - "3002:3002" # Firecrawl API; Hermes uses http://firecrawl:3002 internally
    networks:
      - default
      - firecrawl-internal
    mem_limit: 4G
    cpus: 2.0

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=5
      - BLOCK_MEDIA=true
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    networks:
      - firecrawl-internal
    mem_limit: 2G
    cpus: 1.0

  firecrawl-redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
    networks:
      - firecrawl-internal

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - firecrawl-internal

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl-postgres
    restart: unless-stopped
    env_file:
      - .secrets.env
    environment:
      - POSTGRES_USER=firecrawl
      - POSTGRES_DB=postgres
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    networks:
      - firecrawl-internal

  tinfoil:
    image: nginx:alpine
    container_name: tinfoil
    volumes:
      - /mnt/seagate/tinfoil:/usr/share/nginx/html/:ro
      - ./tinfoil:/etc/nginx:ro
    ports:
      - 9000:9000
    restart: unless-stopped

  yt-music-download:
    build: ./apps/YtMusicDownload
    container_name: yt-music-download
    ports:
      - "8013:8013"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  # obsidian:
  #   image: lscr.io/linuxserver/obsidian:latest
  #   container_name: obsidian
  #   env_file:
  #     - .shared.env
  #   volumes:
  #     - ./apps/obsidian:/config
  #     - ~/obsidian:/data
  #   ports:
  #     - 8000:3000
  #     - 8001:3001
  #   devices:
  #     - /dev/dri:/dev/dri #optional
  #   shm_size: "1gb"
  #   restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - DOCKER_API_VERSION=1.40
    env_file:
      - .shared.env
      - .secrets.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ports:
      #   - 8080:8080
    command: --cleanup --http-api-metrics --http-api-token ${SECRET_WATCHTOWER_KEY?error}
    restart: unless-stopped

networks:
  firecrawl-internal:
    driver: bridge

volumes:
  firecrawl-postgres-data:

