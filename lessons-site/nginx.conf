server {
    listen 80;
    server_name _;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(html|md)$ {
        root /usr/share/nginx/app;
        try_files /index.html =404;
    }

    location ^~ /api/ {
        alias /usr/share/nginx/lessons/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;

        if ($uri ~ "(^|/)\\.") { return 404; }
    }

    location ^~ /assets/ {
        root /usr/share/nginx/app;
        try_files $uri =404;
    }

    location ~* \.css$ {
        root /usr/share/nginx/lessons;
        try_files $uri =404;
    }

    location = / {
        root /usr/share/nginx/app;
        try_files /index.html =404;
    }

    location ~ /$ {
        root /usr/share/nginx/app;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
